[package]
name = "grove"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

# Lib + bin: src/lib.rs is the testable core, src/main.rs is the thin `grove`
# binary installed on PATH. `grove serve` runs the daemon in-process — one binary.

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
grove-api = { path = "../grove-api" }
grove-daemon = { path = "../grove-daemon" }
grove-ops = { path = "../grove-ops" }
# `grove setup` and `grove upgrade`: the gigantic tools' install and swap contract
# (https://gigantic.dev/hotswap/).
hotswap = { git = "https://github.com/jgeschwendt/hotswap", rev = "84dda4eb24b0243cd684718c1f65132ce98fee0e" }
# Signals + `waitpid` for the drain ladder, which needs to distinguish "exited" from
# "still alive" without racing a reaped child.
nix = { version = "0.31", features = ["process", "signal"] }
# Loopback HTTP only: the readiness, identity and drain probes. Blocking because the
# CLI is one-shot — `grove serve` builds the only runtime in this binary, and none of
# these probes run inside it.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
rustix = { version = "1", features = ["fs"] }
# The request bodies the client posts are grove-api types; `Serialize` is needed only
# as a bound on the shared POST helper.
serde = "1"
serde_json = "1"
# The daemon's own runtime, built by `grove serve` and nothing else.
tokio = { version = "1", features = ["net", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
# `test-util` unlocks `clock::TestClock`, so a 30-second ready timeout is testable
# in microseconds. A dev-dependency only: a never-advancing clock reachable from the
# shipped binary is a drain ladder that never times out.
grove-ops = { path = "../grove-ops", features = ["test-util"] }
tempfile = "3"
