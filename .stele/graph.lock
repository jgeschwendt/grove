          "kind": "invariant",
          "resolved": "crates/grove-ops/src/env.rs:250",
          "text": "a share never destroys a human's or agent's file — only a symlink pointing under .trunk is grove's own and may be repointed or GC'd; a real file, a directory or a foreign symlink is a reported conflict, and --fix backs it up before linking",
