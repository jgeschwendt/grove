    "crates/grove": {
      "budget": null,
      "claims": [
        {
          "anchor": "lm:apply-is-ungated",
          "enforced_by": null,
          "id": "apply-is-ungated",
          "kind": "hazard",
          "resolved": "crates/grove/src/commands.rs:329",
          "text": "`grove apply` is UNGATED, not safe: it is the only realizing command that never probes GET /api/health, so with a daemon up it reconciles every root off any lane while that root's engine may be inside the same call, racing git's locks. The gated path to the same convergence is `grove clone add` / POST /api/roots/reconcile.",
          "verified": {
            "digest": "8af2635d5d289a2cc99fbb22306ed94f7bae9f214d70b027c9df55e89a2d6b63",
            "sha": "d6a45a5b0e5193eec69d7cbd0e86a97032ab9775"
          }
        },
        {
          "anchor": "lm:busy-refuses-destructive",
          "enforced_by": null,
          "id": "busy-refuses-destructive",
          "kind": "invariant",
          "resolved": "crates/grove/src/commands.rs:69",
          "text": "a busy daemon REFUSES rather than guessing, at exit 4, wherever there is no declare-only half to fall back on: a remove, since deleting in-process races the realizer and undeclaring alone leaves the bare for adopt to resurrect, and `grove sync`, which is a git write on the root and not a declaration at all",
          "verified": {
            "digest": "b43d174ebda27754dd18d37c8aaa828e0c41de0820ac55da6010e3d3f085c320",
            "sha": "d6a45a5b0e5193eec69d7cbd0e86a97032ab9775"
          }
        },
        {
          "anchor": "lm:cli-health-poll",
          "enforced_by": null,
          "id": "cli-health-poll",
          "kind": "invariant",
          "resolved": "crates/grove/src/server.rs:489",
          "text": "`grove up`/`grove on` poll GET /api/health in a loop until ready — the sanctioned exception to the push-only rule: a one-shot CLI has no channel for the daemon it spawned to push readiness back",
          "verified": {
            "digest": "2141ca7e3f79f128a601adebf8aede2be9c1b3143ef477b33705d76bb906c286",
            "sha": "d6a45a5b0e5193eec69d7cbd0e86a97032ab9775"
          }
        },
        {
          "anchor": "crates/grove/src/error.rs#exit_code",
          "enforced_by": null,
          "id": "exit-code",
          "kind": "invariant",
          "resolved": "crates/grove/src/error.rs:27",
          "text": "exit codes 1/3/4/5/6/7 are a published contract, and the grove_ops::Error to CliError map is what makes the offline codes reachable; an error envelope from the server is exit 1 carrying its code, its message AND error.data's detail, since two of the codes say nothing else",
          "verified": {
            "digest": "9aed280569ba42f2ff2073c2abee1bb988806d6feedb6eefdd87911005195f9a",
            "sha": "d6a45a5b0e5193eec69d7cbd0e86a97032ab9775"
          }
        },
        {
          "anchor": "lm:pending-marker",
          "enforced_by": "crates/grove/tests/update_e2e.rs",
          "id": "pending-marker",
          "kind": "invariant",
          "resolved": "crates/grove/src/update/layout.rs:178",
          "text": "the pending marker names the version AND the direction, written before `current` moves and cleared when the gate answers — so the next `grove up` can tell an unproven forward flip (undo it) from an interrupted rollback (already on the proven version; re-run its gate)",
          "verified": {
            "digest": "7cd867218a3cb178f0f89b4f7b53082f9e1c744335108ceaed47a76af27c9d97",
            "sha": "d6a45a5b0e5193eec69d7cbd0e86a97032ab9775"
          }
        },
        {
          "anchor": "lm:reachability-tri-state",
          "enforced_by": null,
          "id": "reachability-tri-state",
          "kind": "invariant",
          "resolved": "crates/grove/src/api.rs:129",
          "text": "only a connection-level failure means `no daemon`; a timeout or any other post-connect error is a daemon that exists and is slow, and must never trigger in-process realization",
          "verified": {
            "digest": "3bbe07977f0370406727592d1d2285000b3a6ba027e75417a9125c46ec7ecd15",
            "sha": "d6a45a5b0e5193eec69d7cbd0e86a97032ab9775"
          }
        },
        {
          "anchor": "lm:self-update-flip",
          "enforced_by": "crates/grove/tests/update_e2e.rs",
          "id": "self-update-flip",
          "kind": "hazard",
          "resolved": "crates/grove/src/update/mod.rs:245",
          "text": "`grove up` flips the `current` symlink BEFORE the health gate — unavoidable, since served mode restarts whatever `current` points at. A crash in between strands `current` on an unproven version; recovery is the pending marker, read by the next `grove up`.",
          "verified": {
