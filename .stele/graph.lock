          "enforced_by": null,
          "id": "next-status",
          "kind": "invariant",
          "resolved": "crates/grove-daemon/src/engine/status.rs:53",
          "text": "the status transition table is the one place a root's status changes: disk-ready always wins upward, a Derive preserves the driver-owned cloning/degraded transients, and a ReconcileError trusts disk plainly so no stale transient is stranded",
          "verified": {
            "digest": "fbf8ce1366a7a22bf5c8164168f03a5316909c0a69b0e524c1c653e5d44d98dc",
            "sha": "d6a45a5b0e5193eec69d7cbd0e86a97032ab9775"
          }
        },
        {
          "anchor": "lm:per-root-lane",
          "enforced_by": null,
          "id": "per-root-lane",
          "kind": "invariant",
          "resolved": "crates/grove-daemon/src/lane.rs:172",
          "text": "every git-writing op for a root runs on that root's lane — reconcile (the warm-slot promote included), sync, fill, remove, worktree ops and doctor's converge — with three tiers draining foreground before read before background and no preemption of an op already running",
          "verified": {
