          "kind": "invariant",
          "resolved": "crates/grove/src/api.rs:152",
          "text": "a daemon whose GET /api/health names a DIFFERENT home than the client was pointed at is not this home's realizer and reads as offline — GROVE_HOME and GROVE_BIND resolve independently, so without the identity on the wire a client scoped to one home delegates a destructive op to whatever answers the default bind and it is executed against the daemon's home",
