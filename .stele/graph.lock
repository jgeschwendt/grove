          "id": "readiness-whitelist",
          "kind": "invariant",
          "resolved": "crates/grove-daemon/src/guard.rs:21",
          "text": "the readiness gate 503s every non-whitelisted /api route while draining or degraded; the whitelist is exactly /api/health and /api/daemon/shutdown, so state stays observable and a stop request stays reachable",
          "verified": {
            "digest": "d5c34db0fa438e03cc1915550de24fb2c1d721e81f54fa40d5c44545c8f93c5f",
            "sha": "d6a45a5b0e5193eec69d7cbd0e86a97032ab9775"
          }
        },
        {
          "anchor": "crates/grove-daemon/src/engine/mod.rs#spawn_permit_waiter",
          "enforced_by": null,
          "id": "spawn-permit-waiter",
          "kind": "invariant",
          "resolved": "crates/grove-daemon/src/engine/mod.rs:721",
          "text": "a clone permit is TRIED at the head of a root's lane and never waited for there: waiting dispatch-side would hold a permit against roots whose lanes are free, and waiting inside the lane job holds the lane, so a handful of stalled clones would shed every other root's snapshot reads as unavailable while health still says ready. Failing the try, the job returns the lane at once and an off-lane waiter pokes the driver when a permit frees",
          "verified": {
            "digest": "cd54f165da7b1dd82ce923b880f622165d652c4bf96de58c36cb85db6bf13de1",
            "sha": "d6a45a5b0e5193eec69d7cbd0e86a97032ab9775"
          }
        },
        {
          "anchor": "crates/grove-daemon/src/routes.rs#sync",
          "enforced_by": "crates/grove-daemon/tests/http_contract.rs",
          "id": "sync",
          "kind": "invariant",
          "resolved": "crates/grove-daemon/src/routes.rs:151",
          "text": "POST /api/roots/sync is ACCEPT-ONLY and takes no lane of its own: it answers {sync: accepted} once the root's engine has recorded the request, so a burst coalesces through the engine's single background slot, and completion is observed on root_sync_changed / the snapshot's syncing+sync_note rather than returned. Declaredness is read off the manifest first (404), and a declared root no engine is driving is 503 — acknowledging there would be a request nothing recorded and a root_sync_changed no client ever sees",
          "verified": {
            "digest": "458576badf52e81e4ddc0973dacff48cf3eac1510d6f22a3a2727dcdc58dbb13",
            "sha": "d6a45a5b0e5193eec69d7cbd0e86a97032ab9775"
          }
        },
