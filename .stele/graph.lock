          "text": "the mutation guard allows a state-changing request only with NO Origin (every non-browser client) or an Origin whose host is in a FIXED loopback set — never the request's own Host, which is what makes it a DNS-rebinding defense",
          "verified": {
            "digest": "39a5d5e343f2e2a69809bb83087ba8af4e61fb8594d0dadd484ae7cc6aa48276",
            "sha": "d6a45a5b0e5193eec69d7cbd0e86a97032ab9775"
