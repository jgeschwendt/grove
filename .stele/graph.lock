          "id": "unauthenticated-api",
          "kind": "hazard",
          "resolved": "crates/grove-daemon/src/guard.rs:31",
          "text": "the mutating API is UNAUTHENTICATED until served-mode auth lands; the loopback bind gate, the readiness gate and this fixed cross-origin allowlist are the whole of the compensating control, and another app already on a loopback port can still present a loopback origin",
          "verified": {
            "digest": "5ef29b9294becba41a7b7d6322661d47d8e9bbccb36a60c741fa3c6b4fd52f72",
            "sha": "d6a45a5b0e5193eec69d7cbd0e86a97032ab9775"
          }
