# A GitHub Release per merge to main, YYYY.M.N (N counts the month's releases from 0), signed by
# packslip: what `mise use -g packslip:jgeschwendt/grove` installs and `grove upgrade` swaps in
# (https://gigantic.dev/hotswap/ § release). macOS arm64 only: the gigantic foundation runs on
# one Mac.
concurrency:
  # N counts the tags already cut, so two releases never race for one
  group: release

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # every tag, for N
          fetch-depth: 0
          persist-credentials: false
      # mise.toml's rust pin alone: hk and nextest are the gate's, not the build's
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install_args: rust
      # releases stay off shared compiler caches: local, never restored or saved
      - uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        with:
          backend: local
      - id: version
        run: |
          set -euo pipefail
          month=$(date -u +%Y.%-m)
          echo "version=$month.$(git tag -l "v$month.*" | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
      # GROVE_VERSION is what `grove --version` and GET /api/health report
      - env:
          GROVE_VERSION: ${{ steps.version.outputs.version }}
        run: cargo build --release --locked -p grove
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir artifacts
          tar -czf artifacts/grove-aarch64-apple-darwin.tar.gz -C target/release grove
          gh release create "v$VERSION" artifacts/grove-aarch64-apple-darwin.tar.gz \
            --generate-notes --target "$GITHUB_SHA" --title "v$VERSION"
      - uses: jdx/packslip@44e50e5f64551234b4a382d991bd7f7f7d021d06 # v1.11.3
        with:
          artifacts: artifacts/grove-aarch64-apple-darwin.tar.gz
          bin: grove
          tag: v${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}

name: release

on:
  push:
    branches: [main]

permissions:
  attestations: write # packslip attests the archive
  contents: write # the tag, the release and its assets
  id-token: write # keyless sigstore, the workflow identity
